<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --text:#1f2329; --muted:#646a73; --line:#e5e6eb; --brand:#00a6a7; --bg:#fff; }
      @media (prefers-color-scheme: dark) {
        :root { --text:#e6e8ea; --muted:#9aa1ab; --line:#333941; --bg:#22262b; }
      }
      * { box-sizing: border-box; }
      body {
        width: 280px; margin: 0; padding: 14px; background: var(--bg); color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
      h1 span.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
      .stats div { background: rgba(128,128,128,.1); border-radius: 8px; padding: 8px; text-align: center; }
      .stats b { display: block; font-size: 17px; }
      .stats small { color: var(--muted); font-size: 11px; }
      label.switch { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
      button {
        width: 100%; font: inherit; font-size: 13px; padding: 8px 10px; margin-bottom: 6px;
        border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer;
      }
      button:hover { border-color: var(--brand); color: var(--brand); }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      button.primary:hover { background: #00908f; color: #fff; }
      .tip { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
      .tip b { color: var(--text); }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span>BOSS 自动投递</h1>

    <div class="stats">
      <div><b id="applied">0</b><small>今日已投递</small></div>
      <div><b id="scanned">0</b><small>今日已扫描</small></div>
    </div>

    <label class="switch">
      <input type="checkbox" id="dryRun" />
      <span>试运行（不真的投递）</span>
    </label>

    <button class="primary" id="openList">打开岗位列表页</button>
    <button id="openOptions">设置筛选条件与上限</button>

    <div class="tip">
      真正的「开始 / 停止」按钮在<b>岗位列表页右下角</b>的悬浮面板上。<br />
      招呼语用的是你 BOSS 账号里的<b>默认打招呼语</b>。
    </div>

    <script src="../shared/defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
